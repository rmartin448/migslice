[project]
name = "migslice"
version = "0.1.0"
description = "Extract a single migration's SQL from a concatenated migration stream"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "rmartin448" }]

[project.scripts]
migslice = "migslice.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
